<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Зворотній зв'язок</title>

    <link rel="stylesheet" href="style.css">
</head>

<body data-page="feedback">
    <h2>Форма зворотного зв'язку</h2>

    <form action="#" method="post">
        <!-- Блок персональної інформації у рамці -->
        <fieldset>
            <legend>Персональна інформація</legend>

            <label for="name">Прізвище та ім'я:</label><br>
            <input type="text" id="name" name="name" required><br><br>

            <label for="email">E-mail:</label><br>
            <input type="email" id="email" name="email" required><br><br>

            <label for="age">Вік:</label><br>
            <input type="number" id="age" name="age" min="10" max="100"><br><br>

            <label for="education">Освіта:</label><br>
            <select id="education" name="education">
                <option value="повна">Повна</option>
                <option value="неповна">Неповна</option>
                <option value="вища">Вища</option>
                <option value="професійна">Професійна</option>
            </select>
        </fieldset>
        <br>

        <label for="purpose">Мета зворотнього зв'язку:</label><br>
        <select id="purpose" name="purpose">
            <option value="співпраця">Співпраця</option>
            <option value="скарга">Скарга на порушення права власності</option>
            <option value="пропозиція">Пропозиція</option>
            <option value="помилка">Наявність помилки</option>
        </select><br><br>

        <label for="details">Детально:</label><br>
        <textarea id="details" name="details" rows="5" cols="40" maxlength="500"></textarea><br><br>

        <input type="checkbox" id="consent" name="consent" required>
        <label for="consent">Даю згоду на обробку інформації</label><br><br>

        <button type="submit">Відправити</button>
        <button type="reset">Очистити форму</button>
    </form>
    <br>
    <a href="index.html">Повернутися на Головну</a>
</body>
</html>
